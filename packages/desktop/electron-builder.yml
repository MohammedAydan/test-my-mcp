appId: com.motionforge.desktop
productName: MotionForge
electronVersion: 31.7.7
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
extraResources:
  - from: ../core-engine/data/vault/_sfx
    to: sfx
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.video
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-Setup-${version}.${ext}
linux:
  target:
    - target: AppImage
      arch:
        - x64
  category: Video
